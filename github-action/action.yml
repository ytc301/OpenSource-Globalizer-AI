name: "OpenSource Globalizer AI"
description: "AI-powered README translation and localization for open-source projects"
author: "OpenSource Globalizer AI Contributors"

branding:
  icon: "globe"
  color: "blue"

inputs:
  api-key:
    description: "OpenAI API Key (not required when mock is true)"
    required: false
  mock:
    description: "Run in mock mode without calling the API (for testing)"
    required: false
    default: "false"
  languages:
    description: "Target languages, comma separated (e.g. zh-CN,ja,ko)"
    required: false
    default: "zh-CN"
  target:
    description: "File path to translate"
    required: false
    default: "README.md"
  output-dir:
    description: "Output directory for translated files"
    required: false
    default: "docs"
  model:
    description: "OpenAI model name"
    required: false
    default: "gpt-4o"
  base-url:
    description: "API base URL"
    required: false
    default: "https://api.openai.com/v1"
  auto-pr:
    description: "Whether to automatically create a Pull Request"
    required: false
    default: "true"

runs:
  using: "docker"
  image: "docker://ghcr.io/ytc301/opensource-globalizer-ai:v0.2.0"

outputs:
  translated:
    description: "Comma-separated list of generated translation files"
