name: AI Translation

on:
  push:
    paths:
      - "README.md"
  workflow_dispatch:
    inputs:
      mock:
        description: "Mock mode (no API key required)"
        type: boolean
        default: false
      languages:
        description: "Target languages, comma separated"
        type: string
        default: "zh-CN,ja"

permissions:
  contents: write
  pull-requests: write

env:
  # 自定义 API 兼容端点 (如 DeepSeek): 在仓库 Settings → Variables 配置 OPENAI_BASE_URL
  OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 真实模式: 使用 OPENAI_API_KEY secret 翻译 README
      - name: Run translation
        id: translate
        uses: ytc301/OpenSource-Globalizer-AI/github-action@v0.2.0
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
          languages: ${{ inputs.languages || 'zh-CN,ja' }}
          mock: ${{ inputs.mock && 'true' || 'false' }}
          model: ${{ vars.GLOBALIZER_MODEL || 'gpt-4o' }}
          # 自定义 API 兼容端点: 仓库 Settings → Variables 配置 OPENAI_BASE_URL
          base-url: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}

      - name: Show generated files
        run: ls -la docs/ 2>/dev/null || echo "No translation output"

      # 翻译产物在 .gitignore 中 (docs/README.*.md), 需强制添加才能进入 PR
      - name: Force add translation files
        run: |
          git add -f docs/README.*.md
          git status --short

      # 真实模式: 翻译有变更时自动创建 PR
      # Mock 模式不创建 PR (仅验证链路)
      - name: Create Pull Request
        if: ${{ !inputs.mock }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🌍 i18n: Auto-translate README to ${{ inputs.languages || 'zh-CN,ja' }}"
          branch: "i18n/translate-readme-${{ github.run_id }}"
          title: "🌍 i18n: Auto-translate README to ${{ inputs.languages || 'zh-CN,ja' }}"
          body: |
            ## 🌍 AI Auto-Translation

            Auto-translated `README.md` to:
            - ${{ inputs.languages || 'zh-CN,ja' }}

            Generated by [OpenSource Globalizer AI](https://github.com/ytc301/OpenSource-Globalizer-AI) 🤖
          delete-branch: true
          labels: i18n
